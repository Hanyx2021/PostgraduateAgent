[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor-match"
version = "0.1.0"
description = "推研导师匹配与自荐邮件 Agent：证据化匹配 + 可核验的自荐邮件草稿"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pypinyin>=0.51",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "modelscope>=1.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
